seed: 42
device: "auto"

data:
  dataset: "nico_pp"
  data_root: "data/nico_pp"
  batch_size: 64
  num_val_samples_per_class: 50
  num_workers: 4
  image_size: 224

model:
  name: "convnext_base"
  pretrained: true

training:
  epochs: 10
  lr: 0.0001
  weight_decay: 0.01

logging:
  log_dir: "logs"
  use_wandb: false
  wandb_project: "erm-benchmark"
