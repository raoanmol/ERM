seed: 42
device: "auto"

data:
  dataset: "celeba"
  data_root: "data/celeba"
  batch_size: 64
  num_val_samples_per_class: 1495
  num_workers: 4
  image_size: 224
  target_attr: "Male"

model:
  name: "vit_base16"
  pretrained: true

training:
  epochs: 10
  lr: 0.0001
  weight_decay: 0.01

logging:
  log_dir: "logs"
  use_wandb: false
  wandb_project: "erm-benchmark"
